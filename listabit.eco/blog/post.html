<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog - Listabit</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; color: #111; line-height: 1.6; }
main { max-width: 680px; margin: 0 auto; padding: 32px 20px 48px; }
a { color: #1bad3a; }
</style>
</head>
<body>
<main>
<div id="post">Loading...</div>
<p><a href="index.html">Back to Blog</a> | <a href="../index.html">Back to Listabit</a></p>
</main>
<script>
function inline(text) {
  return text
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/\*([^*]+)\*/g, "<em>$1</em>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function render(md) {
  const lines = md.split("\n");
  let html = "", inList = false;
  for (const line of lines) {
    if (line.startsWith("# ")) { if (inList) { html += "</ul>"; inList = false; } html += "<h1>" + inline(line.slice(2)) + "</h1>"; }
    else if (line.startsWith("## ")) { if (inList) { html += "</ul>"; inList = false; } html += "<h2>" + inline(line.slice(3)) + "</h2>"; }
    else if (line.startsWith("- ")) { if (!inList) { html += "<ul>"; inList = true; } html += "<li>" + inline(line.slice(2)) + "</li>"; }
    else if (line.trim() === "") { if (inList) { html += "</ul>"; inList = false; } }
    else { if (inList) { html += "</ul>"; inList = false; } html += "<p>" + inline(line) + "</p>"; }
  }
  if (inList) html += "</ul>";
  return html;
}
const slug = new URLSearchParams(location.search).get("slug") || "";
fetch("posts/" + slug + ".md").then(r => r.text()).then(md => {
  document.getElementById("post").innerHTML = render(md);
});
</script>
</body>
</html>
