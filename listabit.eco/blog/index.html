<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog - Listabit</title>
<style>
body { font-family: system-ui, sans-serif; margin: 0; color: #111; line-height: 1.6; }
main { max-width: 680px; margin: 0 auto; padding: 32px 20px 48px; }
a { color: #1bad3a; }
.post { border: 1px solid #ddd; border-radius: 12px; padding: 16px; margin: 12px 0; }
.post small { color: #666; }
</style>
</head>
<body>
<main>
<h1>Blog</h1>
<p>Short notes about reuse, repair, and buying near you.</p>
<div id="list">Loading...</div>
<p><a href="../index.html">Back to Listabit</a></p>
</main>
<script>
fetch("posts.json").then(r => r.json()).then(posts => {
  const list = document.getElementById("list");
  list.textContent = "";
  posts.forEach(p => {
    const div = document.createElement("div");
    div.className = "post";
    const a = document.createElement("a");
    a.href = "post.html?slug=" + encodeURIComponent(p.slug);
    a.textContent = p.title;
    const small = document.createElement("div");
    const s = document.createElement("small");
    s.textContent = p.date;
    small.appendChild(s);
    div.appendChild(a);
    div.appendChild(small);
    list.appendChild(div);
  });
});
</script>
</body>
</html>
